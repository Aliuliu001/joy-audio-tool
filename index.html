<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joy Audio Tool — Tải phát âm Oxford</title>
<style>
  :root { --brown:#5C4A3A; --beige:#F6F3EE; --accent:#8B6F47; --green:#4C7C5C; --red:#B04A3A; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--beige); color:#333; margin:0; padding:16px; max-width:760px; margin:0 auto; }
  h1 { color:var(--brown); font-size:22px; text-align:center; }
  .card { background:#fff; border-radius:12px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  label { font-weight:600; color:var(--brown); display:block; margin:8px 0 4px; }
  textarea { width:100%; min-height:140px; border:2px solid #ddd; border-radius:10px; padding:10px; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input[type=text] { padding:10px 12px; font-size:16px; border-radius:10px; border:2px solid #ddd; }
  button { background:var(--brown); color:#fff; border:none; border-radius:24px; padding:12px 24px; font-size:17px; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.secondary { background:var(--accent); }
  #gate input { flex:1; }
  .word { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee; font-size:16px; }
  .word audio { flex:1; height:32px; }
  .ok { color:var(--green); font-weight:700; } .fail { color:var(--red); }
  #progress { height:10px; background:#e5ddd2; border-radius:6px; overflow:hidden; margin-top:8px; }
  #bar { height:100%; width:0%; background:var(--green); }
  .hint { font-size:14px; color:#777; }
  #gate { border:2px dashed var(--accent); }
</style>
</head>
<body>
<h1>🔊 Joy Audio Tool</h1>
<p style="text-align:center" class="hint">Dán danh sách từ → nghe thử → tải 1 file zip về máy</p>

<div class="card" id="gate">
  <label>🔑 Mã dùng tháng này (hỏi quản lý để lấy):</label>
  <div class="row">
    <input type="text" id="code" placeholder="Ví dụ: 142731" autocomplete="off" inputmode="numeric">
    <button onclick="unlock()">Mở</button>
  </div>
  <p class="hint">Mỗi tháng cô sẽ nhận 1 mã mới trong nhóm.</p>
</div>

<div id="app" style="display:none">
  <div class="card">
    <label>📝 Danh sách từ (mỗi dòng 1 từ hoặc cụm từ):</label>
    <textarea id="words" placeholder="anchor&#10;grow down&#10;photosynthesis"></textarea>
    <label>🗣️ Giọng đọc cho từ/cụm Oxford KHÔNG có:</label>
    <div class="row">
      <select id="voice">
        <option value="oxford-uk">📕 Oxford UK (từ có Oxford, cụm dùng Edge UK)</option>
        <option value="oxford-us">📕 Oxford US (từ có Oxford, cụm dùng Edge US)</option>
        <option value="en-GB-SoniaNeural">👩 Sonia — Nữ UK</option>
        <option value="en-GB-LibbyNeural">👩 Libby — Nữ UK 2</option>
        <option value="en-GB-RyanNeural">👨 Ryan — Nam UK</option>
        <option value="en-US-AriaNeural">👩 Aria — Nữ US</option>
        <option value="en-US-EmmaNeural">👩 Emma — Nữ US 2</option>
        <option value="en-US-JennyNeural">👩 Jenny — Nữ US 3</option>
        <option value="en-US-GuyNeural">👨 Guy — Nam US</option>
        <option value="en-US-ChristopherNeural">👨 Christopher — Nam US 2</option>
      </select>
      <select id="speed">
        <option value="1">🎚️ Tốc độ: Bình thường</option>
        <option value="0.25">0.25× (rất chậm)</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="0.85">0.85×</option>
        <option value="1.1">1.1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5× (nhanh)</option>
      </select>
      <button onclick="start()">1️⃣ Tìm phát âm</button>
      <button class="secondary" id="zipBtn" onclick="downloadZip()" disabled>2️⃣ Tải file zip</button>
    </div>
    <p class="hint">🎧 Nghe thử 8 giọng Edge trước khi chọn:</p>
    <div class="row" id="samples">
      <button type="button" class="secondary" onclick="playSample('voices/nu-UK-sonia.mp3',this)">👩 Sonia</button>
      <button type="button" class="secondary" onclick="playSample('voices/nu-UK-libby.mp3',this)">👩 Libby</button>
      <button type="button" class="secondary" onclick="playSample('voices/nam-UK-ryan.mp3',this)">👨 Ryan</button>
      <button type="button" class="secondary" onclick="playSample('voices/nu-US-aria.mp3',this)">👩 Aria</button>
      <button type="button" class="secondary" onclick="playSample('voices/nu-US-emma.mp3',this)">👩 Emma</button>
      <button type="button" class="secondary" onclick="playSample('voices/nu-US-jenny.mp3',this)">👩 Jenny</button>
      <button type="button" class="secondary" onclick="playSample('voices/nam-US-guy.mp3',this)">👨 Guy</button>
      <button type="button" class="secondary" onclick="playSample('voices/nam-US-christopher.mp3',this)">👨 Christopher</button>
    </div>
    <div id="progress"><div id="bar"></div></div>
    <p class="hint" id="status"></p>
  </div>
  <div class="card"><div id="list"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
