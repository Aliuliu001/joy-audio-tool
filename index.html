<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joy Audio Tool — Download Oxford Pronunciation</title>
<style>
  :root { --brown:#5C4A3A; --beige:#F6F3EE; --accent:#8B6F47; --green:#4C7C5C; --red:#B04A3A; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--beige); color:#333; margin:0; padding:16px; max-width:860px; margin:0 auto; }
  h1 { color:var(--brown); font-size:22px; text-align:center; }
  .card { background:#fff; border-radius:12px; padding:16px; margin:12px 0; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  label { font-weight:600; color:var(--brown); display:block; margin:8px 0 4px; }
  textarea { width:100%; min-height:140px; border:2px solid #ddd; border-radius:10px; padding:10px; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select, input[type=text] { padding:10px 12px; font-size:16px; border-radius:10px; border:2px solid #ddd; }
  button { background:var(--brown); color:#fff; border:none; border-radius:24px; padding:12px 24px; font-size:17px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.secondary { background:var(--accent); padding:8px 16px; font-size:15px; }
  #gate input { flex:1; }
  .word { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee; font-size:16px; }
  .word audio { flex:1; height:32px; }
  .ok { color:var(--green); font-weight:700; } .fail { color:var(--red); }
  #progress { height:10px; background:#e5ddd2; border-radius:6px; overflow:hidden; margin-top:8px; }
  #bar { height:100%; width:0%; background:var(--green); transition:width 0.3s; }
  .hint { font-size:14px; color:#777; margin-top:4px; }
  #gate { border:2px dashed var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { padding:10px 20px; border-radius:8px 8px 0 0; cursor:pointer; background:#ddd; color:#666; font-weight:600; }
  .tab.active { background:var(--brown); color:#fff; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .cols2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .voice-group h4 { color:var(--brown); margin:0 0 8px; font-size:16px; }
  .voice-list { display:flex; flex-direction:column; gap:6px; }
  .slider-wrap { display:flex; align-items:center; gap:12px; margin:8px 0; }
  .slider-wrap label { margin:0; min-width:80px; }
  input[type=range] { flex:1; height:8px; border-radius:4px; background:#e5ddd2; outline:none; -webkit-appearance:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--brown); cursor:pointer; }
  input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--brown); cursor:pointer; border:none; }
  .speed-val { min-width:50px; text-align:right; font-weight:600; color:var(--brown); }
  .mode-box { border:2px solid #ddd; border-radius:10px; padding:12px; margin:8px 0; }
  .mode-box.active { border-color:var(--brown); background:#faf9f7; }
  .mode-box h4 { margin:0 0 8px; font-size:15px; color:var(--brown); }
  .dialogue-roles { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<h1>🔊 Joy Audio Tool</h1>
<p style="text-align:center" class="hint">Download Oxford pronunciation & generate dialogues</p>

<div class="card" id="gate">
  <label>🔑 Enter activation code for this month:</label>
  <div class="row">
    <input type="text" id="code" placeholder="e.g. 142731" autocomplete="off" inputmode="numeric">
    <button onclick="unlock()">Unlock</button>
  </div>
  <p class="hint">You will receive a new code each month in the group.</p>
</div>

<div id="app" style="display:none">
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">📚 Vocabulary</div>
  </div>

  <!-- TAB 1: Vocabulary -->
  <div class="tab-content active" id="tab0">
    <div class="card">
      <label>📝 Word list (one word or phrase per line):</label>
      <textarea id="words" placeholder="anchor&#10;grow into&#10;photosynthesis"></textarea>
      
      <label>🔍 Choose accent:</label>
      <div class="row" style="gap:12px;margin:12px 0">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="accent" value="uk" checked style="width:20px;height:20px">
          <span style="font-size:18px">🇬🇧 Oxford UK</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="accent" value="us" style="width:20px;height:20px">
          <span style="font-size:18px">🇺🇸 Oxford US</span>
        </label>
      </div>

      <div class="row" style="margin-top:16px">
        <button onclick="startVocab()">1️⃣ Find pronunciation</button>
        <button class="secondary" id="zipBtn" onclick="downloadZip()" disabled>2️⃣ Download zip</button>
      </div>
      <div id="progress"><div id="bar"></div></div>
      <p class="hint" id="status"></p>
    </div>
    <div class="card"><div id="list"></div></div>
  </div>


</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
